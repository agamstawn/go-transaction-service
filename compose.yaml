services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    depends_on:
      db:
        condition: service_healthy

    environment:
      DATABASE_URL: "postgres://app:localpassword@db:5432/transactions?sslmode=disable"
      API_KEY: "${API_KEY:-}"
      API_ACCOUNT_ID: "${API_ACCOUNT_ID:-7}"
      LISTEN_ADDRESS: "0.0.0.0:8080"

    ports:
      - "127.0.0.1:8081:8080"

  db:
    image: postgres:17

    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: localpassword
      POSTGRES_DB: transactions

    ports:
      - "127.0.0.1:5436:5432"

    volumes:
      - transactions_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d transactions"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  transactions_pgdata:
