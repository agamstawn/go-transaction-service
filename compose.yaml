services:
  db:
    image: postgres:17

    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: localpassword
      POSTGRES_DB: transactions

    ports:
      - "127.0.0.1:5436:5432"

    volumes:
      - transactions_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d transactions"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  transactions_pgdata:
